# roomhy.com multi-subdomain routing
# Update filesystem paths and SSL directives based on your VPS setup.

upstream roomhy_backend {
    server 127.0.0.1:5001;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_origin $cors_allow_origin {
    default "";
    "~^https://(www\.)?roomhy\.com$" $http_origin;
    "https://admin.roomhy.com" $http_origin;
    "https://app.roomhy.com" $http_origin;
    "https://api.roomhy.com" $http_origin;
    "http://localhost:3000" $http_origin;
    "http://localhost:5000" $http_origin;
    "http://localhost:5001" $http_origin;
    "http://localhost:5173" $http_origin;
    "http://localhost:5174" $http_origin;
    "http://localhost:5175" $http_origin;
    "http://localhost:5176" $http_origin;
    "http://localhost:5177" $http_origin;
    "http://127.0.0.1:3000" $http_origin;
    "http://127.0.0.1:5000" $http_origin;
    "http://127.0.0.1:5001" $http_origin;
    "http://127.0.0.1:5173" $http_origin;
    "http://127.0.0.1:5174" $http_origin;
    "http://127.0.0.1:5175" $http_origin;
    "http://127.0.0.1:5176" $http_origin;
    "http://127.0.0.1:5177" $http_origin;
}

server {
    listen 80;
    server_name roomhy.com www.roomhy.com;

    root /var/www/roomhy/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name admin.roomhy.com;

    root /var/www/roomhy;
    index superadmin/index.html;

    location = / {
        return 302 /superadmin/index.html;
    }

    location /superadmin/ {
        try_files $uri $uri/ =404;
    }

    location /digital-checkin/ {
        try_files $uri $uri/ =404;
    }

    location /website/js/ {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name app.roomhy.com;

    root /var/www/roomhy;
    index propertyowner/index.html;

    location = / {
        return 302 /propertyowner/index.html;
    }

    location /propertyowner/ {
        try_files $uri $uri/ =404;
    }

    location /tenant/ {
        try_files $uri $uri/ =404;
    }

    location /js/ {
        try_files $uri $uri/ =404;
    }

    location = /booking-form.html {
        return 301 /propertyowner/booking-form.html;
    }
}

server {
    listen 80;
    server_name api.roomhy.com;

    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type" always;
    add_header Vary "Origin" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location /socket.io/ {
        proxy_pass http://roomhy_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://roomhy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
